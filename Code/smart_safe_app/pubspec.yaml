name: smart_safe_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.2
  geocoding:
  flutter_svg: ^2.1.1
  firebase_core: ^2.23.0
  firebase_messaging: ^14.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/svg/auth_background.png
    - assets/svg/settings_bg.svg
    - assets/svg/Smart_safe_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/svg/Smart_safe_icon.png"
  adaptive_icon_background: "#0B3D91"
  adaptive_icon_foreground: "assets/svg/Smart_safe_icon.png"